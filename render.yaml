# Servidor de conexión de Ecosystem HR Suite para una empresa.
# Se crea con el botón «Deploy to Render»: región Frankfurt (UE), plan de pago más pequeño y disco de 1 GB.
services:
  - type: web
    name: ecosystem-hr
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/info
    autoDeployTrigger: "off"
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
